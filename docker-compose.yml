# Site + observabilidade:
#   cp .env.example .env   (defina GRAFANA_ADMIN_PASSWORD)
#   docker compose up -d --build
# Site http://localhost · Prometheus http://localhost:9090 · Grafana http://localhost:3000
services:
  web:
    build: .
    image: rua-acesa-web:${TAG:-local}
    container_name: rua-acesa-web
    ports:
      - "80:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: rua-acesa-nginx-exporter
    command: ["--nginx.scrape-uri=http://web:8081/stub_status"]
    depends_on: [web]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: rua-acesa-blackbox
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observabilidade/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rua-acesa-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [nginx-exporter, blackbox]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rua-acesa-grafana
    environment:
      # sem valor padrao: o compose recusa subir sem a senha
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus:
  grafana:
