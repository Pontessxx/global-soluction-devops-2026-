name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-e-teste:
    name: Build + teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t rua-acesa-web:${{ github.sha }} .
      - name: Sobe o container e testa
        run: |
          docker run -d --name web -p 8080:8080 rua-acesa-web:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q "Rua Acesa"
          test "$(docker exec web id -u)" != "0"

  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: semgrep scan --config p/dockerfile --config p/terraform --config p/github-actions --error --metrics=off Dockerfile infra .github

  trivy:
    name: Trivy (imagem e IaC)
    runs-on: ubuntu-latest
    needs: [build-e-teste, gitleaks, semgrep]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t rua-acesa-web:${{ github.sha }} .
      - name: Trivy na imagem
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: rua-acesa-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy no Terraform e Dockerfile
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    name: Deploy na Azure
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: producao
    steps:
      - name: Login na Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Libera o SSH so para este runner (temporario)
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az network nsg rule create -g rg-rua-acesa-web --nsg-name nsg-rua-acesa \
            -n gh-runner --priority 120 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$RUNNER_IP/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges 22
          sleep 30
      - name: Atualiza a VM (SSH)
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_HOST }}
          GRAFANA_PW: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new azureuser@"$HOST" \
            "cd ~/app && git pull -q && GRAFANA_ADMIN_PASSWORD='$GRAFANA_PW' docker compose up -d --build"
          rm -f key
      - name: Fecha o SSH do runner
        if: always()
        run: az network nsg rule delete -g rg-rua-acesa-web --nsg-name nsg-rua-acesa -n gh-runner
