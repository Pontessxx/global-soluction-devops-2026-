global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # trafego e saturacao: metricas internas do nginx
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # latencia e erros: sonda HTTP no site, como um usuario faria
  - job_name: site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web:8080/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
