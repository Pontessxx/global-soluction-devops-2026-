# Site publico (porta 8080 dentro do container; o compose publica como 80)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Metricas internas (porta 8081, NAO publicada: so o exporter na rede do compose enxerga)
server {
    listen 8081;
    server_name _;
    location = /stub_status {
        stub_status;
        access_log off;
    }
}
